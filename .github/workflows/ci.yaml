name: Build rule packages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "6 6 * * 1"
  workflow_dispatch:

concurrency:
  group: artifacts-publish
  cancel-in-progress: false

env:
  DOMI_CLI_VERSION: "0.1.8"
  SING_BOX_VERSION: "1.14.1"

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Validate packages and test isolation
        run: |
          python scripts/rulebuild.py validate
          python -m unittest discover -s tests -v

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: |
          curl -fsSL "https://github.com/CAB233/domi-cli/releases/download/v${DOMI_CLI_VERSION}/domi-cli-x86_64-unknown-linux-gnu" -o domi-cli
          sudo install -Dvm755 domi-cli -t /usr/local/bin/
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" curl -fsSL https://sing-box.app/install.sh | sh -s -- --version "${SING_BOX_VERSION}"
          domi-cli --version
          sing-box version
      - name: Build all packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/rulebuild.py build --output dist
      - uses: actions/upload-artifact@v6
        with:
          name: rule-packages
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rule-packages
          path: dist
      - name: Publish one complete snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init published
          cd published
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git ls-remote --exit-code origin refs/heads/artifacts >/dev/null 2>&1; then
            git fetch --depth=1 origin artifacts
            git checkout -B artifacts FETCH_HEAD
          else
            git checkout --orphan artifacts
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a ../dist/. .
          git add --all
          if ! git diff --quiet --staged; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update rule packages"
            git push origin artifacts
          fi
