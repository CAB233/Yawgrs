name = "v2ray"
description = "v2fly and Loyalsoldier geosite rule sets"

[publish]
target = "domain"

[source.dlc]
src = "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat"
sha256 = "SKIP"
rename = "dlc.dat"

[source.geosite]
src = "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
sha256 = "SKIP"
rename = "geosite.dat"

[source.config]
src = "domi.toml"
sha256 = "9953a341ff37fb71828dd4ae6fc64971ca87abc5fc4c75826043fd6284af7e6f"
rename = "domi.toml"

[prepare]
command = [
  'cp -v "$SRCDIR/dlc.dat" "$BUILDDIR/dlc.dat"',
  'cp -v "$SRCDIR/geosite.dat" "$BUILDDIR/geosite.dat"',
  'cp -v "$SRCDIR/domi.toml" "$BUILDDIR/domi.toml"',
]

[build]
type = "domi"
